[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "ant-ai"
version = "1.6.2"
description = "A lightweight Python framework for building multi-agent AI systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Cezar Sas", email = "cezar.sas@supsi.ch" },
    { name = "Vincenzo Giuffrida", email = "vincenzo.giuffrida@supsi.ch" },
    { name = "Sandra Mitrović", email = "sandra.mitrovic@supsi.ch" },
    { name = "Matteo Salani", email = "matteo.salani@supsi.ch" },
]

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk[sql,http-server,grpc,encryption,telemetry]>=1.1.2",
    "fastapi>=0.141.1",
    "litellm>=1.97.0",
    "loguru>=0.7.3",
    "mcp>=2.0.0",
    "pathspec>=1.1.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
guardrails-ai = ["guardrails-ai>=0.11.0", "tokenizers>=0.23.1", "huggingface-hub>=1.27.0,<2.0"]
langfuse = ["langfuse>=4.14.4"]
mem0 = ["mem0ai>=2.0.18"]
openai = ["openai>=2.54.0"]
viz = ["graphviz>=0.21"]
all = [
    "guardrails-ai>=0.11.0",
    "tokenizers>=0.23.1",
    "huggingface-hub>=1.27.0,<2.0",
    "langfuse>=4.14.4",
    "mem0ai>=2.0.18",
    "openai>=2.54.0",
    "graphviz>=0.21",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "griffe-pydantic>=1.3.1",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-panzoom-plugin>=0.5.2",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.6",
]

[project.urls]
Homepage = "https://idea.idsia.ch/ant-ai/"
Documentation = "https://idea.idsia.ch/ant-ai/"
Repository = "https://github.com/idea-idsia/ant-ai"

[tool.uv]
exclude-newer = "P2D" # Wait for the package to be up for at least 2 days before updating to it.
